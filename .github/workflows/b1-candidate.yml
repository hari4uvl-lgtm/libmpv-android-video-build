name: Lumine B1 SoX shelves lookahead arm64
on:
  push:
    branches: [codex/music-b1-hq-20261007]
  workflow_dispatch:
concurrency:
  group: lumine-b1-candidate
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake pkg-config libtool ninja-build nasm unzip python3-pip python3-setuptools wget
          python3 -m pip install 'meson==1.2.3' 'mako==1.2.4'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;25.2.9519653'
      - name: Build B1 candidate, arm64 only
        working-directory: buildscripts
        env:
          TRAVIS: '1'
        run: |
          set -euxo pipefail
          mkdir -p sdk
          ln -s "$ANDROID_HOME" sdk/android-sdk-linux
          # Omit unused, unpinned encoder/media_kit checkouts from this baseline.
          sed '/^# libx264/,+1d; /^# media_kit/,+1d' include/download-deps.sh > include/download-b1-deps.sh
          chmod +x include/download-b1-deps.sh
          ./include/download-b1-deps.sh
          curl --fail --location https://deb.debian.org/debian/pool/main/libs/libsoxr/libsoxr_0.1.3.orig.tar.xz -o deps/soxr-source.tar.xz
          echo 'b111c15fdc8c029989330ff559184198c161100a59312f5dc19ddeb9b5a15889  deps/soxr-source.tar.xz' | sha256sum -c -
          tar -xJf deps/soxr-source.tar.xz -C deps
          mv deps/soxr-0.1.3-Source deps/libsoxr
          chmod +x scripts/libsoxr.sh
          ./patch.sh
          cp flavors/default.sh scripts/ffmpeg.sh
          ./build.sh --arch arm64 mpv 2>&1 | tee b1-build.log
          mkdir -p ../b1-artifact
          cp prefix/arm64-v8a/lib/libmpv.so ../b1-artifact/libmpv-unstripped.so
          cp prefix/arm64-v8a/lib/libmpv.so ../b1-artifact/libmpv.so
          sdk/android-sdk-linux/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all ../b1-artifact/libmpv.so
          cp b1-build.log ../b1-artifact/
          cp include/depinfo.sh ../b1-artifact/
          cp patches/af_lumendsp.c ../b1-artifact/
          cp deps/ffmpeg/libavfilter/filter_list.c ../b1-artifact/
          for dep in deps/*; do
            if [ -d "$dep/.git" ]; then
              printf '%s ' "$dep" >> ../b1-artifact/source-revisions.txt
              git -C "$dep" rev-parse HEAD >> ../b1-artifact/source-revisions.txt
              git -C "$dep" diff --stat >> ../b1-artifact/source-revisions.txt
            fi
          done
          sha256sum ../b1-artifact/*.so > ../b1-artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumine-b1-arm64-baseline
          path: |
            b1-artifact/
            buildscripts/b1-build.log
            buildscripts/deps/ffmpeg/_build-arm64/ffbuild/config.log
            buildscripts/deps/mpv/_build-arm64/config.log
