name: Lumine B2 isolated output arm64 candidate
on:
  push:
    branches: [codex/music-b2-qualification-20261007]
  workflow_dispatch:
concurrency:
  group: lumine-b2-candidate
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake pkg-config libtool ninja-build nasm unzip python3-pip python3-setuptools wget
          python3 -m pip install 'meson==1.2.3' 'mako==1.2.4'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;25.2.9519653'
      - name: Build B2 candidate, arm64 only
        working-directory: buildscripts
        env:
          TRAVIS: '1'
        run: |
          set -euxo pipefail
          mkdir -p sdk
          ln -s "$ANDROID_HOME" sdk/android-sdk-linux
          # Omit unused, unpinned encoder/media_kit checkouts from this baseline.
          sed '/^# libx264/,+1d; /^# media_kit/,+1d' include/download-deps.sh > include/download-b2-deps.sh
          chmod +x include/download-b2-deps.sh
          ./include/download-b2-deps.sh
          curl --fail --location https://deb.debian.org/debian/pool/main/libs/libsoxr/libsoxr_0.1.3.orig.tar.xz -o deps/soxr-source.tar.xz
          echo 'b111c15fdc8c029989330ff559184198c161100a59312f5dc19ddeb9b5a15889  deps/soxr-source.tar.xz' | sha256sum -c -
          tar -xJf deps/soxr-source.tar.xz -C deps
          mv deps/soxr-0.1.3-Source deps/libsoxr
          chmod +x scripts/libsoxr.sh
          ./patch.sh
          cp flavors/default.sh scripts/ffmpeg.sh
          ./build.sh --arch arm64 mpv 2>&1 | tee b2-build.log
          mkdir -p ../b2-artifact
          cp prefix/arm64-v8a/lib/libmpv.so ../b2-artifact/libmpv-unstripped.so
          cp prefix/arm64-v8a/lib/libmpv.so ../b2-artifact/libmpv.so
          sdk/android-sdk-linux/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all ../b2-artifact/libmpv.so
          cp b2-build.log ../b2-artifact/
          cp include/depinfo.sh ../b2-artifact/
          cp patches/af_lumendsp.c ../b2-artifact/
          cp patches/af_lumenout.c patches/lumenout_*.c patches/lumenout_*.h ../b2-artifact/
          compiler=sdk/android-sdk-linux/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          "$compiler" -O2 -Wall -Wextra -Werror -I patches patches/lumenout_core.c patches/lumenout_bands.c patches/lumenout_clip.c ../music-b2-pc/lumenout_benchmark.c -lm -o ../b2-artifact/lumenout-benchmark
          "$compiler" -O2 -Wall -Wextra -Werror -I patches patches/lumenout_core.c patches/lumenout_bands.c patches/lumenout_clip.c ../music-b2-pc/lumenout_host.c -lm -o ../b2-artifact/lumenout-host
          cp deps/ffmpeg/_build-arm64/libavfilter/filter_list.c ../b2-artifact/
          for dep in deps/*; do
            if [ -d "$dep/.git" ]; then
              printf '%s ' "$dep" >> ../b2-artifact/source-revisions.txt
              git -C "$dep" rev-parse HEAD >> ../b2-artifact/source-revisions.txt
              git -C "$dep" diff --stat >> ../b2-artifact/source-revisions.txt
            fi
          done
          sha256sum ../b2-artifact/*.so > ../b2-artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumine-b2-arm64-candidate
          path: |
            b2-artifact/
            buildscripts/b2-build.log
            buildscripts/deps/ffmpeg/_build-arm64/ffbuild/config.log
            buildscripts/deps/mpv/_build-arm64/config.log
