name: Lumine paired band budget qualification
on:
  push:
    branches: [codex/music-band-budget-20261009]
    paths: [music-band-paired-pc/**, .github/workflows/music-band-paired-pc.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumine-music-band-paired-pc
  cancel-in-progress: true
jobs:
  host-tools:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Baseline and paired allowance sanitizer checks
        run: |
          set -euxo pipefail
          mkdir -p paired-tools
          # GCC and sanitizer runtimes are already installed on the runner.
          # Local pinned Clang builds the Windows qualification hosts; do not
          # gate Linux memory checks on a stalled apt mirror download.
          gcc -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Werror -I music-b2-pc music-b2-pc/lumenout_core.c music-b2-pc/lumenout_bands.c music-b2-pc/lumenout_clip.c music-b2-pc/lumenout_core_test.c -lm -o paired-tools/baseline-check
          ./paired-tools/baseline-check | tee paired-tools/baseline-check.log
          for reserve in 0 5 10; do
            if [ "$reserve" = 5 ]; then value=0.5; elif [ "$reserve" = 10 ]; then value=1.0; else value=0.0; fi
            gcc -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -DLUMEN_PAIRED_RESERVE_DB=$value -Wall -Wextra -Werror -I music-band-paired-pc music-band-paired-pc/lumenout_core.c music-band-paired-pc/lumenout_bands.c music-band-paired-pc/lumenout_clip.c music-band-paired-pc/lumenout_core_test.c -lm -o paired-tools/check-$reserve
            ./paired-tools/check-$reserve | tee paired-tools/check-$reserve.log
          done
          sha256sum music-b2-pc/lumenout* music-band-paired-pc/* > paired-tools/SOURCE_SHA256SUMS
          sha256sum paired-tools/*check paired-tools/check-* > paired-tools/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lumine-band-paired-sanitizer-results
          path: paired-tools/
