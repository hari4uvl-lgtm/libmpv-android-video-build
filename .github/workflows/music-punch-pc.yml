name: Lumine isolated punch recovery qualification
on:
  push:
    branches: [codex/music-punch-prototype-20261008]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumine-music-punch-pc
  cancel-in-progress: true
jobs:
  host-tools:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Baseline and recovery prototypes only
        run: |
          set -euxo pipefail
          mkdir -p punch-tools
          common="-O2 -Wall -Wextra -Werror -static"
          x86_64-w64-mingw32-gcc $common -I music-b2-pc music-b2-pc/lumenout_core.c music-b2-pc/lumenout_bands.c music-b2-pc/lumenout_clip.c music-b2-pc/lumenout_host.c -lm -o punch-tools/baseline-host.exe
          for density in 05 10 15 25; do
            x86_64-w64-mingw32-gcc $common -DLUMENOUT_PUNCH_DENSITY=0.$density -I music-punch-pc music-punch-pc/lumenout_core.c music-punch-pc/lumenout_bands.c music-punch-pc/lumenout_clip.c music-punch-pc/lumenout_host.c -lm -o punch-tools/punch-$density-host.exe
            gcc -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -DLUMENOUT_PUNCH_DENSITY=0.$density -Wall -Wextra -Werror -I music-punch-pc music-punch-pc/lumenout_core.c music-punch-pc/lumenout_bands.c music-punch-pc/lumenout_clip.c music-punch-pc/lumenout_core_test.c -lm -o punch-tools/check-$density
            ./punch-tools/check-$density
          done
          sha256sum music-b2-pc/lumenout* music-punch-pc/* > punch-tools/SOURCE_SHA256SUMS
          sha256sum punch-tools/*.exe > punch-tools/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lumine-punch-host-tools
          path: punch-tools/
