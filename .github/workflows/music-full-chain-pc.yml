name: Lumine complete music graph PC tools

# Review this isolated branch before pushing. No release/APK job is triggered.
on:
  push:
    branches: [codex/music-full-chain-pc-20261010]
    paths: [music-full-chain-pc/**, .github/workflows/music-full-chain-pc.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumine-full-chain-pc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 make pkg-config cmake
      - name: Build pinned complete graph renderer
        env:
          TARGET: ${{ matrix.target }}
        run: bash music-full-chain-pc/build.sh
      - name: Linux generated-fixture smoke checks
        if: matrix.target == 'linux'
        run: |
          python3 music-full-chain-pc/smoke.py \
            --ffmpeg full-chain-pc-artifact/ffmpeg \
            --output full-chain-pc-artifact/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumine-full-chain-pc-${{ matrix.target }}
          path: full-chain-pc-artifact/
